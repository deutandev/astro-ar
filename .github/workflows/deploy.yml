name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Validate VPS deployment secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          missing=0
          for name in VPS_SSH_KEY VPS_USER VPS_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment secret::${name} is not configured in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deploy to VPS
        run: |
          rsync -avzr --delete -e "ssh -o StrictHostKeyChecking=no" dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/ar/"
